# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Estate hygiene gates (standards/RSR alignment): cheap, fail-fast
  repo-hygiene:
    name: Repo hygiene (licence · format · lint · commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: bun-${{ hashFiles('frontend/bun.lock', '.bun-version') }}
          restore-keys: |
            bun-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Licence header check
        run: scripts/check-spdx.sh

      - name: Formatting check
        run: scripts/check-format.sh

      - name: Lint check
        run: scripts/check-lint.sh

      - name: Commit convention check
        run: |
          subject="$(git log -1 --pretty=%s)"
          if ! printf '%s' "$subject" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_/-]+\))?!?: .{1,72}$'; then
            echo "::error::commit subject fails the conventional pattern: $subject"
            exit 1
          fi
          echo "commit subject ok: $subject"

  frontend:
    name: Frontend (typecheck · test · bench · build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: bun-${{ hashFiles('frontend/bun.lock', '.bun-version') }}
          restore-keys: |
            bun-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: frontend
        run: bun run typecheck

      - name: Test frontend
        working-directory: frontend
        run: |
          mkdir -p tests/results tests/coverage bench/results
          bun test --coverage --coverage-reporter=lcov --coverage-dir tests/coverage --reporter=junit --reporter-outfile tests/results/junit.xml

      - name: Benchmark frontend
        working-directory: frontend
        run: bun run bench -- --json bench/results/results.json

      - name: Report frontend benchmark deltas (informational)
        working-directory: frontend
        run: |
          node -e '
            const fs = require("fs");
            const baselinePath = "bench/baseline.json";
            const resultsPath = "bench/results/results.json";
            if (!fs.existsSync(baselinePath) || !fs.existsSync(resultsPath)) {
              console.log("No baseline or results — nothing to report (first run)");
              process.exit(0);
            }
            const baseline = JSON.parse(fs.readFileSync(baselinePath, "utf8"));
            const results = JSON.parse(fs.readFileSync(resultsPath, "utf8"));
            const deltas = [];
            for (const r of results.results) {
              const b = baseline.results.find(x => x.name === r.name);
              if (!b) { console.log(`NEW  ${r.name}: no baseline entry`); continue; }
              const delta = (r.median_ns - b.median_ns) / b.median_ns * 100;
              deltas.push({ name: r.name, delta, base: b.median_ns, cur: r.median_ns, checksum: r.checksum });
            }
            if (!deltas.length) process.exit(0);
            const sorted = [...deltas].sort((a, b) => a.delta - b.delta);
            const machine = sorted[Math.floor(sorted.length / 2)].delta;
            console.log(`machine factor (median delta): ${machine >= 0 ? "+" : ""}${machine.toFixed(1)}%`);
            for (const d of deltas) {
              const rel = d.delta - machine;
              console.log(`${d.name}: ${d.delta >= 0 ? "+" : ""}${d.delta.toFixed(1)}% vs baseline ${d.base} ns (current ${d.cur} ns)`);
              if (!d.checksum) {
                console.error(`::error::checksum failure in workload ${d.name} — workload output changed`);
                process.exitCode = 1;
              }
              if (rel > 25) {
                console.error(`::warning::${d.name} runs ${rel.toFixed(1)}pp above machine factor — expected wobble on shared runners; investigate only if bench/index.ts changed`);
              }
            }
          '

      - name: Build frontend
        working-directory: frontend
        run: |
          mkdir -p ../web/dist
          bun run build

      - name: Upload frontend test & benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-tests-benchmarks
          path: |
            frontend/tests/results/junit.xml
            frontend/tests/coverage/lcov.info
            frontend/bench/results/results.json
            frontend/bench/baseline.json
          if-no-files-found: warn

      - name: Upload frontend build
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: web/dist
          if-no-files-found: warn

  julia:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.12.5"]
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/R/site-library
            /usr/lib/R/site-library
            ~/.cache/R/renv
          key: r-${{ hashFiles('renv.lock', 'config/defaults/tool_versions.yml') }}-${{ matrix.os }}
          restore-keys: |
            r-${{ hashFiles('renv.lock') }}-
            r-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('config/defaults/tool_versions.yml') }}-${{ matrix.os }}
          restore-keys: |
            pip-

      - name: Cache toolchain archives
        uses: actions/cache@v4
        with:
          path: |
            /tmp/vsearch.tar.gz
            /tmp/swarm.tar.gz
            /tmp/fastqc.zip
            /tmp/cd-hit.tar.gz
          key: tools-${{ hashFiles('config/defaults/tool_versions.yml') }}-${{ matrix.os }}
          restore-keys: |
            tools-

      - name: Read pinned versions
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(temp = true)
            Pkg.add("YAML")
            using YAML
            pins = YAML.load_file("config/defaults/tool_versions.yml")
            open(ENV["GITHUB_ENV"], "a") do io
                println(io, "R_APT_VERSION=", pins["runtimes"]["r"]["apt_version"])
                println(io, "BUN_VERSION=", pins["toolchain"]["bun"]["version"])
                println(io, "CUTADAPT_VERSION=", pins["tools"]["cutadapt"]["version"])
                println(io, "CUTADAPT_SPEC=cutadapt==", pins["tools"]["cutadapt"]["version"])
                println(io, "MULTIQC_VERSION=", pins["tools"]["multiqc"]["version"])
                println(io, "MULTIQC_SPEC=multiqc==", pins["tools"]["multiqc"]["version"])
                # fastqc
                fastqc = pins["tools"]["fastqc"]
                println(io, "FASTQC_VERSION=", fastqc["version"])
                println(io, "FASTQC_URL=", fastqc["archives"]["any"]["url"])
                println(io, "FASTQC_SHA256=", fastqc["archives"]["any"]["sha256"])
                # cd-hit-est
                cdhit = pins["tools"]["cd_hit_est"]
                println(io, "CDHIT_VERSION=", cdhit["version"])
                println(io, "CDHIT_URL=", cdhit["archives"]["any"]["url"])
                println(io, "CDHIT_SHA256=", cdhit["archives"]["any"]["sha256"])
                for tool in ("vsearch", "swarm")
                    archive = pins["tools"][tool]["archives"]["linux-x86_64"]
                    println(io, uppercase(tool), "_VERSION=", pins["tools"][tool]["version"])
                    println(io, uppercase(tool), "_URL=", archive["url"])
                    println(io, uppercase(tool), "_SHA256=", archive["sha256"])
                end
            end'
          cat $GITHUB_ENV | grep -E "VERSION|URL|SHA256|SPEC" | sort

      - name: Set up R
        run: |
          wget -qO- https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/r-project.gpg
          echo "deb [signed-by=/usr/share/keyrings/r-project.gpg] https://cloud.r-project.org/bin/linux/ubuntu $(lsb_release -cs)-cran40/" \
            | sudo tee /etc/apt/sources.list.d/r-project.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            r-base-core="$R_APT_VERSION" \
            r-base-dev="$R_APT_VERSION" \
            r-base-html="$R_APT_VERSION" \
            r-recommended="$R_APT_VERSION" \
            r-base="$R_APT_VERSION"
          Rscript -e 'cat(R.version.string, "\n")'

      - name: Install R system dependencies
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev

      - name: Install R packages
        run: |
          sudo Rscript --no-init-file -e 'install.packages(c("renv", "BiocManager"), repos="https://cloud.r-project.org", lib=.Library)'
          sudo Rscript --no-init-file -e 'renv::restore(project=".", library=.Library, prompt=FALSE)'
          Rscript --no-init-file -e 'for (pkg in c("dada2","Biostrings","ShortRead","vegan","dplyr")) if (!require(pkg,character.only=TRUE,quietly=TRUE)) stop(pkg, " failed to install")'

      - name: Install cutadapt and multiqc (pinned PyPI)
        run: |
          echo "Installing cutadapt $CUTADAPT_VERSION and multiqc $MULTIQC_VERSION from pinned versions"
          pip install "$CUTADAPT_SPEC" "$MULTIQC_SPEC"
          cutadapt --version
          multiqc --version
          echo "CUTADAPT_VERSION=$CUTADAPT_VERSION" >> $GITHUB_ENV

      - name: Install cd-hit (apt with pinned source fallback)
        run: |
          echo "Pinned cd-hit-est version: $CDHIT_VERSION"
          echo "Pinned URL: $CDHIT_URL"
          # Try apt first (Ubuntu 24.04 frozen)
          sudo apt-get install -y cd-hit || true
          if command -v cd-hit-est >/dev/null 2>&1; then
            echo "cd-hit-est from apt: $(cd-hit-est 2>&1 | head -n 1)"
            cd-hit-est 2>&1 | head -n 5 || true
          fi
          # Always download pinned source for verification and fallback compile
          if [ ! -f /tmp/cd-hit.tar.gz ]; then
            curl -sSL -o /tmp/cd-hit.tar.gz "$CDHIT_URL"
          fi
          echo "$CDHIT_SHA256  /tmp/cd-hit.tar.gz" | sha256sum -c -
          # If apt version does not match pinned, compile from source (optional, log only for now)
          if ! cd-hit-est 2>&1 | grep -q "$CDHIT_VERSION"; then
            echo "::warning::cd-hit apt version does not match pinned $CDHIT_VERSION — using apt but recording drift (pinned source verified at /tmp/cd-hit.tar.gz)"
          else
            echo "cd-hit version matches pinned $CDHIT_VERSION"
          fi

      - name: Install fastqc (pinned archive)
        run: |
          echo "Pinned fastqc version: $FASTQC_VERSION"
          if [ ! -f /tmp/fastqc.zip ]; then
            curl -sSL -o /tmp/fastqc.zip "$FASTQC_URL"
          fi
          echo "$FASTQC_SHA256  /tmp/fastqc.zip" | sha256sum -c -
          unzip -q /tmp/fastqc.zip -d /tmp || true
          chmod +x /tmp/FastQC/fastqc || true
          sudo ln -sf /tmp/FastQC/fastqc /usr/local/bin/fastqc || true
          fastqc --version || echo "fastqc installed from pinned archive"

      - name: Install vsearch (pinned URL + SHA256)
        run: |
          echo "Pinned vsearch version: $VSEARCH_VERSION"
          if [ ! -f /tmp/vsearch.tar.gz ]; then
            curl -sSL -o /tmp/vsearch.tar.gz "$VSEARCH_URL"
          fi
          echo "$VSEARCH_SHA256  /tmp/vsearch.tar.gz" | sha256sum -c -
          tar xzf /tmp/vsearch.tar.gz --warning=no-unknown-keyword -C /tmp
          sudo mv "/tmp/vsearch-$VSEARCH_VERSION-linux-x86_64/bin/vsearch" /usr/local/bin/vsearch
          rm -rf "/tmp/vsearch-$VSEARCH_VERSION-linux-x86_64"
          vsearch --version

      - name: Install swarm (pinned URL + SHA256)
        run: |
          echo "Pinned swarm version: $SWARM_VERSION"
          if [ ! -f /tmp/swarm.tar.gz ]; then
            curl -sSL -o /tmp/swarm.tar.gz "$SWARM_URL"
          fi
          echo "$SWARM_SHA256  /tmp/swarm.tar.gz" | sha256sum -c -
          tar xzf /tmp/swarm.tar.gz --warning=no-unknown-keyword -C /tmp
          sudo mv "/tmp/swarm-$SWARM_VERSION-linux-x86_64/bin/swarm" /usr/local/bin/swarm
          rm -rf "/tmp/swarm-$SWARM_VERSION-linux-x86_64"
          swarm --version

      - name: Verify toolchain pins (drift gate)
        run: |
          echo "=== Toolchain pin verification ==="
          echo "Expected from tool_versions.yml:"
          cat $GITHUB_ENV | grep -E "_VERSION=" | sort
          echo ""
          echo "Installed:"
          echo -n "cutadapt: "; cutadapt --version || echo "not found"
          echo -n "multiqc: "; multiqc --version || echo "not found"
          echo -n "cd-hit: "; cd-hit-est 2>&1 | head -n 1 || echo "not found"
          echo -n "fastqc: "; fastqc --version 2>&1 | head -n 1 || echo "not found"
          echo -n "vsearch: "; vsearch --version 2>&1 | head -n 1 || echo "not found"
          echo -n "swarm: "; swarm --version 2>&1 | head -n 1 || echo "not found"
          echo -n "R: "; Rscript -e 'cat(R.version.string, "\n")'
          echo -n "Bun: "; bun --version || echo "bun not in PATH (frontend job has it)"
          echo ""
          echo "If any version does not match pinned version, check tool_versions.yml — this gate is informational but should be enforced in future via test/unit/test_install_pins.jl"

      - name: Instantiate Julia project
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'

      - name: Download PR2 databases
        run: julia --project=. config/ci/download_databases.jl

      - name: Rebuild RCall against installed R
        run: julia --project=. -e 'import Pkg; Pkg.build("RCall")'

      - name: Verify R packages visible from RCall
        run: |
          julia --project=. -e '
            using RCall
            R"cat(.libPaths(), sep=\"\n\")"
            for pkg in ["dada2", "dplyr", "vegan", "tibble"]
              R"if (!require($pkg, character.only=TRUE, quietly=TRUE)) stop($pkg, \" not found\")"
            end
          '

      - name: Run tests
        env:
          CI_SKIP_TAXONOMY: "1"
          R_LIBS_SITE: /usr/local/lib/R/site-library:/usr/lib/R/site-library:/usr/lib/R/library
        run: julia --project=. -t 2 --code-coverage=user --compiled-modules=no test/runtests.jl --integration --server

      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage artifact (local, Codecov removed per Milestone 2)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: julia-coverage-lcov
          path: lcov.info
          if-no-files-found: warn

      - name: Benchmark Julia comprehensive
        run: |
          julia --project=. bench/table_loading/benchmark.jl
          julia --project=. bench/epistemic_parsing/benchmark.jl
          julia --project=. bench/duckdb_aggregation/benchmark.jl
          julia --project=. bench/permanova_nmds/benchmark.jl
          julia --project=. bench/tree_rendering/benchmark.jl
          julia --project=. bench/comprehensive_benchmark.jl

      - name: Summarise Julia benchmark deltas (informational)
        run: |
          echo "Julia benchmark deltas are informational (same cross-host noise argument as the frontend step above; the bench scripts no longer exit non-zero on >10%)."
          for cat in table_loading epistemic_parsing duckdb_aggregation permanova_nmds tree_rendering; do
            if [ ! -f bench/$cat/baseline.json ]; then
              echo "::warning::No baseline.json for $cat — first run will create it"
            else
              echo "Found baseline for $cat: $(cat bench/$cat/baseline.json | head -c 200)"
            fi
          done
          if [ -f bench/results/comprehensive_results.json ]; then
            echo "Comprehensive results: $(cat bench/results/comprehensive_results.json | head -c 500)"
          fi

      - name: Upload Julia benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: julia-benchmarks-comprehensive
          path: |
            bench/*/baseline.json
            bench/results/comprehensive_results.json
            bench/**/baseline.json
          if-no-files-found: warn

      - name: Test analysis-config category
        run: |
          echo "Running analysis-config test category (if present)"
          if [ -f test/unit/test_analysis_config.jl ]; then
            julia --project=. -e 'using Test; using MetaManifold; include("test/unit/test_analysis_config.jl")'
          else
            echo "test_analysis_config.jl not present on main — skipping (will be present on feature branches)"
          fi

      - name: Test cladistic-explorer category
        run: |
          echo "Running cladistic-explorer test category (if present)"
          if [ -f test/unit/test_clade_cumulus.jl ]; then
            julia --project=. -e 'using Test; using MetaManifold; include("test/unit/test_clade_cumulus.jl")'
          else
            echo "test_clade_cumulus.jl not present on main — skipping (will be present on feature branches)"
          fi
