name: CI

# This fork's account allows only GitHub's own actions (actions/*) and its own,
# each pinned to a full commit SHA. Upstream's julia-actions, oven-sh/setup-bun
# and codecov/codecov-action are none of these, and with them this workflow
# ended in startup_failure on every run. So Julia and Bun are installed here
# from the archives config/defaults/tool_versions.yml pins, each refused unless
# it hashes to the pinned SHA256, and the Julia depot is cached with
# actions/cache. Coverage is kept as a workflow artifact, since the Codecov
# project is upstream's. test/unit/test_install_pins.jl asserts that every
# `uses:` in .github/workflows is allowed by that policy.

on:
  push:
    branches: [main]
  # Any base branch, so a PR stacked on another one is tested too.
  pull_request:

permissions:
  contents: read

# Pushes to main queue so each merge gets a test result; PR updates cancel the
# run for the superseded head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    # The name is a fixed string, it carries no version, and the job has NO matrix.
    # Both are required, and the first without the second is a trap that has already
    # been sprung here once.
    #
    # A branch ruleset matches a required status check by the DISPLAY NAME GitHub posts
    # for the job. A renamed check does not fail -- it is simply absent, and an absent
    # required check can never be satisfied, so every pull request deadlocks until an
    # admin bypasses the rule, triggered by nothing more alarming than editing a version
    # number.
    #
    # MEASURED on hyperpolymath/MetaManifold-WebUI#39 (2026-09-21): this job, named exactly `Julia tests` but still
    # carrying a 1x1 `strategy.matrix`, posted `Julia tests (1.12.5, ubuntu-24.04)`.
    # GitHub appends the matrix combination whenever the name does not already reference
    # the matrix, so a 1x1 matrix is still a matrix and the pins were still embedded in
    # the check name. The matrix was therefore removed rather than merely renamed around:
    # it selected exactly one combination and bought nothing.
    #
    # The two values it held are literals below, each keeping its own reasoning.
    # `test/unit/test_install_pins.jl` asserts, for EVERY job in this file, that the name
    # interpolates nothing AND that the job has no matrix -- so this cannot regress
    # silently. If a matrix is ever genuinely wanted here, the required context must move
    # to a matrix-free aggregator job first.
    name: Julia tests
    # Explicit, not ubuntu-latest: the R pin below names an apt package revision built
    # for 24.04, and a runner that silently rolled to the next LTS would take that pin
    # with it. `runs-on` cannot read `env`, so this is a literal.
    runs-on: ubuntu-24.04
    # The repository's root .Rprofile sources renv/activate.R, so R started from
    # the checkout auto-activates renv and rewrites the library paths. renv is a
    # local-development convenience; CI installs into the system library and
    # reaches it through R_LIBS_SITE, so the autoloader is switched off here.
    # This variable covers the unprivileged R that Julia embeds through RCall.
    # It cannot cover the installs themselves, which run under sudo: sudo resets
    # the environment, so those commands pass --no-init-file instead.
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
      # Pinned rather than tracking latest stable, because a pinned Manifest.toml
      # resolved by an unpinned Julia is not a reproducible build. These must equal
      # runtimes.julia.archives.linux-x86_64 in the pin file, whose version must
      # equal julia_version in Manifest.toml; they cannot be read from the pin
      # file, since nothing can be read before Julia exists.
      # test/unit/test_install_pins.jl fails if any of them disagree.
      JULIA_URL: https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-1.12.5-linux-x86_64.tar.gz
      JULIA_SHA256: 41b84d727e4e96fbf3ed9e92fa195d773d247b9097f73fad688f8b699758bae7

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes

      - name: Install Julia
        run: |
          source scripts/ci/fetch_pinned.sh
          fetch_pinned "$JULIA_URL" julia.tar.gz
          echo "$JULIA_SHA256  julia.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/julia
          sudo tar xzf julia.tar.gz -C /opt/julia --strip-components=1
          rm julia.tar.gz
          echo /opt/julia/bin >> "$GITHUB_PATH"

      # The registry, packages, artifacts and precompiled caches, keyed on the
      # Manifest (which also names the Julia version). Saved once instantiation
      # has succeeded, so a failed run cannot store a half-built depot.
      - name: Restore the Julia depot
        id: julia-depot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.julia/registries
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
          key: julia-depot-${{ runner.os }}-${{ hashFiles('Manifest.toml') }}
          restore-keys: |
            julia-depot-${{ runner.os }}-

      # Every external version CI installs is read from the committed pin file, so CI
      # and a developer's machine cannot drift apart. A temporary environment is used
      # because the project environment cannot be instantiated until R is present:
      # RCall's build step requires it.
      - name: Read pinned versions
        run: |
          julia -e '
            using Pkg
            Pkg.activate(temp = true)
            Pkg.add("YAML")
            using YAML
            pins = YAML.load_file("config/defaults/tool_versions.yml")
            open(ENV["GITHUB_ENV"], "a") do io
                println(io, "R_APT_VERSION=", pins["runtimes"]["r"]["apt_version"])
                bun = pins["toolchain"]["bun"]
                println(io, "BUN_VERSION=", bun["version"])
                println(io, "BUN_URL=", bun["archives"]["linux-x86_64"]["url"])
                println(io, "BUN_SHA256=", bun["archives"]["linux-x86_64"]["sha256"])
                println(io, "CUTADAPT_SPEC=cutadapt==", pins["tools"]["cutadapt"]["version"])
                println(io, "MULTIQC_SPEC=multiqc==", pins["tools"]["multiqc"]["version"])
                fastqc = pins["tools"]["fastqc"]["archives"]["any"]
                println(io, "FASTQC_URL=", fastqc["url"])
                println(io, "FASTQC_SHA256=", fastqc["sha256"])
                for tool in ("vsearch", "swarm")
                    archive = pins["tools"][tool]["archives"]["linux-x86_64"]
                    println(io, uppercase(tool), "_VERSION=", pins["tools"][tool]["version"])
                    println(io, uppercase(tool), "_URL=", archive["url"])
                    println(io, uppercase(tool), "_SHA256=", archive["sha256"])
                end
            end'

      # R + required packages (needed by RCall)
      # Install R directly via apt to avoid r-lib/actions/setup-r mangling
      # R_HOME and stripping default packages (utils, methods, stats, etc.)
      # The version is pinned to the apt revision named in the pin file, which tracks
      # R.Version in renv.lock; CRAN's Ubuntu repository retains older revisions, so
      # this resolves rather than merely requesting the newest.
      - name: Set up R
        run: |
          wget --https-only -qO- https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/r-project.gpg
          echo "deb [signed-by=/usr/share/keyrings/r-project.gpg] https://cloud.r-project.org/bin/linux/ubuntu $(lsb_release -cs)-cran40/" \
            | sudo tee /etc/apt/sources.list.d/r-project.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            r-base-core="$R_APT_VERSION" \
            r-base-dev="$R_APT_VERSION" \
            r-base-html="$R_APT_VERSION" \
            r-recommended="$R_APT_VERSION" \
            r-base="$R_APT_VERSION"
          Rscript -e 'cat(R.version.string, "\n")'

      - name: Install R system dependencies
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev

      # The R packages are restored from renv.lock, the same pin a developer restores
      # from, rather than resolved against whatever the repositories serve that day.
      # Asking for a bare package name pins nothing: a Bioconductor release is frozen,
      # so dada2 and its kin held still, but CRAN publishes only its newest revision,
      # so vegan silently moved off the pinned 2.7-3 and test_provenance caught the
      # drift. Restoring into .Library keeps the system library that the RCall steps
      # and R_LIBS_SITE below expect, and renv is invoked explicitly here rather than
      # left to activate itself. --no-init-file stops R sourcing the repository's
      # .Rprofile, and with it the renv autoloader, which would otherwise rebind
      # .Library to its own sandbox under root's cache; the flag is used rather than
      # the environment variable above because sudo resets the environment first.
      #
      # renv's package cache persists across runs, so a restore that fails partway
      # resumes from the packages it already built. The cache sits outside ~ because
      # the restore runs as root. The run id makes each key unique so every attempt
      # saves its progress; restore-keys picks the newest match.
      - name: Restore the renv cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/renv-cache
          key: renv-${{ runner.os }}-R${{ env.R_APT_VERSION }}-${{ hashFiles('renv.lock') }}-${{ github.run_id }}
          restore-keys: |
            renv-${{ runner.os }}-R${{ env.R_APT_VERSION }}-${{ hashFiles('renv.lock') }}-
            renv-${{ runner.os }}-R${{ env.R_APT_VERSION }}-

      # R_CLI_DYNAMIC and TERM make renv print progress one line at a time in the log.
      - name: Install R packages
        env:
          RENV_PATHS_CACHE: /opt/renv-cache
        run: |
          sudo mkdir -p "$RENV_PATHS_CACHE"
          sudo chmod 777 "$RENV_PATHS_CACHE"
          sudo env R_CLI_DYNAMIC=false TERM=dumb Rscript --no-init-file -e 'install.packages(c("renv", "BiocManager"), repos="https://cloud.r-project.org", lib=.Library)'
          sudo env RENV_PATHS_CACHE="$RENV_PATHS_CACHE" R_CLI_DYNAMIC=false TERM=dumb Rscript --no-init-file -e 'renv::restore(project=".", library=.Library, prompt=FALSE)'
          Rscript --no-init-file -e 'for (pkg in c("dada2","Biostrings","ShortRead","vegan","dplyr","MASS","zCompositions")) if (!require(pkg,character.only=TRUE,quietly=TRUE)) stop(pkg, " failed to install")'

      # Saved on failure too, since the packages built before a failure are the ones
      # the next attempt should reuse. Root writes the cache, so it is made readable first.
      - name: Make the renv cache readable
        if: always()
        run: sudo chmod -R a+rX /opt/renv-cache || true

      - name: Save the renv cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/renv-cache
          key: renv-${{ runner.os }}-R${{ env.R_APT_VERSION }}-${{ hashFiles('renv.lock') }}-${{ github.run_id }}

      - name: Install cutadapt
        run: pip install "$CUTADAPT_SPEC"

      # The one tool CI does not pin. Ubuntu ships no versioned cd-hit revision worth
      # naming, and 24.04 is frozen, so its cd-hit does not move under us; the version
      # that arrives is recorded at preflight, where a discrepancy is visible.
      - name: Install cd-hit
        run: sudo apt-get install -y cd-hit

      # Downloaded against the pinned URL and refused unless it hashes to the pinned
      # SHA256, so CI runs the same bytes install.jl puts on a developer's machine.
      - name: Install vsearch
        run: |
          source scripts/ci/fetch_pinned.sh
          fetch_pinned "$VSEARCH_URL" vsearch.tar.gz
          echo "$VSEARCH_SHA256  vsearch.tar.gz" | sha256sum -c -
          tar xzf vsearch.tar.gz --warning=no-unknown-keyword
          sudo mv "vsearch-$VSEARCH_VERSION-linux-x86_64/bin/vsearch" /usr/local/bin/vsearch
          rm -rf vsearch.tar.gz "vsearch-$VSEARCH_VERSION-linux-x86_64"
          vsearch --version

      - name: Install swarm
        run: |
          source scripts/ci/fetch_pinned.sh
          fetch_pinned "$SWARM_URL" swarm.tar.gz
          echo "$SWARM_SHA256  swarm.tar.gz" | sha256sum -c -
          tar xzf swarm.tar.gz --warning=no-unknown-keyword
          sudo mv "swarm-$SWARM_VERSION-linux-x86_64/bin/swarm" /usr/local/bin/swarm
          rm -rf swarm.tar.gz "swarm-$SWARM_VERSION-linux-x86_64"
          swarm --version

      - name: Install multiqc
        run: pip install "$MULTIQC_SPEC"

      # FastQC ships as a Java launcher script; `fastqc --version` checks that Java
      # is on PATH as well.
      - name: Install fastqc
        run: |
          source scripts/ci/fetch_pinned.sh
          fetch_pinned "$FASTQC_URL" fastqc.zip
          echo "$FASTQC_SHA256  fastqc.zip" | sha256sum -c -
          sudo unzip -q -d /opt fastqc.zip
          rm -f fastqc.zip
          sudo chmod +x /opt/FastQC/fastqc
          sudo ln -sf /opt/FastQC/fastqc /usr/local/bin/fastqc
          fastqc --version

      - name: Instantiate Julia project
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'

      - name: Save the Julia depot
        if: steps.julia-depot.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.julia/registries
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
          key: julia-depot-${{ runner.os }}-${{ hashFiles('Manifest.toml') }}

      # Downloaded against the pinned URL and refused unless it hashes to the pinned
      # SHA256, as install.jl does when no bun of this version is on PATH.
      - name: Install Bun
        run: |
          source scripts/ci/fetch_pinned.sh
          fetch_pinned "$BUN_URL" bun.zip
          echo "$BUN_SHA256  bun.zip" | sha256sum -c -
          unzip -q bun.zip
          sudo mv bun-linux-x64/bun /usr/local/bin/bun
          rm -rf bun.zip bun-linux-x64
          test "$(bun --version)" = "$BUN_VERSION"

      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Frontend unit tests
        working-directory: frontend
        run: bun run test

      - name: Download PR2 databases
        run: julia --project=. config/ci/download_databases.jl

      - name: Rebuild RCall against installed R
        run: julia --project=. -e 'import Pkg; Pkg.build("RCall")'

      - name: Verify R packages visible from RCall
        run: |
          julia --project=. -e '
            using RCall
            R"cat(.libPaths(), sep=\"\n\")"
            for pkg in ["dada2", "dplyr", "vegan", "tibble", "MASS", "zCompositions"]
              R"if (!require($pkg, character.only=TRUE, quietly=TRUE)) stop($pkg, \" not found\")"
            end
          '

      - name: Run tests
        env:
          CI_SKIP_TAXONOMY: "1"
          R_LIBS_SITE: /usr/local/lib/R/site-library:/usr/lib/R/site-library:/usr/lib/R/library
        # A failure also posts annotations, which the checks API serves without the full
        # log. Annotations are capped at 4096 bytes, so each failing assertion gets its own
        # (up to 8), followed by the summary rows that report a failure or an error.
        shell: bash
        run: |
          set +e
          julia --project=. -t 2 --code-coverage=user --compiled-modules=no test/runtests.jl --integration --server 2>&1 | tee /tmp/julia-tests.log
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            enc() { head -c 3500 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }
            awk '
              /Test Summary:/ { left = 0 }
              /(Test Failed at|Error During Test at)/ || (left == 0 && /Got exception outside of a @test/) { n++; left = 60 }
              left > 0 { print > ("/tmp/julia-failure-" n ".txt"); left-- }
            ' /tmp/julia-tests.log
            shown=0
            for f in $(ls /tmp/julia-failure-*.txt 2>/dev/null | sort -t- -k3 -n); do
              shown=$((shown + 1))
              [ "$shown" -gt 8 ] && break
              echo "::error title=Julia test failure ${shown}::$(enc < "$f")"
            done
            awk '
              /Test Summary:/ { print; p = index($0, "Pass"); pe = (p ? p + 3 : 0); t = index($0, "Total"); next }
              pe && t && index($0, "|") && substr($0, pe + 1, t - pe - 1) ~ /[0-9]/ { print; next }
              /ERROR:|Some tests did not pass/ { print }
            ' /tmp/julia-tests.log | tail -n 60 > /tmp/julia-tests-summary.txt
            echo "::error title=Julia tests failed (summary)::$(enc < /tmp/julia-tests-summary.txt)"
            if [ "$shown" -eq 0 ]; then
              echo "::error title=Julia tests failed (tail)::$(tail -c 3500 /tmp/julia-tests.log | enc)"
            fi
          fi
          exit "$status"

      # What julia-processcoverage did: the .cov files under src/ to lcov.info, with
      # CoverageTools pinned to an exact release.
      - name: Process coverage
        run: |
          julia -e '
            using Pkg
            Pkg.activate(temp = true)
            Pkg.add(name = "CoverageTools", version = "1.4.2")
            using CoverageTools
            LCOV.writefile("lcov.info", process_folder("src"))'

      # The Codecov project (codecov.yml, the README badge) is upstream's, so the fork
      # keeps its coverage as an artifact of the run instead.
      - name: Keep coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  # Machine-checked proofs of the Benjamini-Hochberg adjustment and the TSS/RLE
  # scaling algebra (proofs/agda, proofs/agda/README.md).
  # Agda publishes no 2.6.4.3 binary, and agda-stdlib 2.1 requires Agda 2.6.4.x,
  # so the pair comes from Debian trixie, which packages exactly that pair with
  # pre-built library interfaces. The image is pinned by digest and the two
  # packages by revision, so a rebuild in the archive fails loudly here instead
  # of silently changing the checker. These pins live here rather than in
  # config/defaults/tool_versions.yml because no other job and no installer
  # reads them.
  agda:
    name: Agda proofs
    runs-on: ubuntu-24.04
    container: debian:trixie-20250929-slim@sha256:1caf1c703c8f7e15dcf2e7769b35000c764e6f50e4d7401c355fb0248f3ddfdb
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes

      - name: Install Agda and the standard library
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends agda-bin=2.6.4.3-1+b2 agda-stdlib=2.1-4
          agda --version | grep -qx 'Agda version 2.6.4.3'
          grep -qx 'name: standard-library-2.1' /usr/share/agda-stdlib/standard-library.agda-lib

      # Runs before the type-check: --safe already refuses postulates, but the
      # audit also refuses holes, check-disabling pragmas and flags, and any
      # module that MetaManifold/All.agda does not import (an unimported module
      # is never type-checked at all).
      - name: Axiom audit
        run: bash proofs/tests/axiom-audit.sh

      - name: Type-check
        env:
          AGDA_DIR: /tmp/agda-dir
        run: |
          mkdir -p "$AGDA_DIR"
          echo /usr/share/agda-stdlib/standard-library.agda-lib > "$AGDA_DIR/libraries"
          cd proofs/agda
          agda MetaManifold/All.agda
