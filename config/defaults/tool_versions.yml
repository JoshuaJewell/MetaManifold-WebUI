  # The phylogeny tools. MAFFT, RAxML and gappa publish no binary archive for
  # Linux, so each is pinned by its source tarball: the installer prefers the
  # distribution package for MAFFT and RAxML where there is one and otherwise
  # compiles the tarball, and always compiles gappa, whose build fetches its own
  # dependencies at the commits the tarball names. These hashes were computed on
  # 2026-09-28 from the bytes each URL served; for trimAl and IQ-TREE they match
  # the `digest` GitHub's release API reports for the same asset.
  # Held at 7.490: 7.525 segfaults in pairlocalalign on `--auto --addfragments`,
  # the placement step's alignment.
  mafft:
    version: "7.490"
    source: source_archive
    archives:
      any:
        url: "https://mafft.cbrc.jp/alignment/software/mafft-7.490-without-extensions-src.tgz"
        sha256: "79dcae383e76163d272bd438078067f006e75d06c51c4f31d49cc9baa2a72ef0"

