      response_types: [
        "non-negative integer counts",
        "unit-denominator rational counts",
      ],
      designs: [
        "per-sample summaries; independence is not required for this arithmetic",
        "optional alignment-preserving sample groups",
      ],
      supported_conditions: [
        "counts are exact non-negative integers or rationals with denominator one",
        "sample and feature labels are non-blank and unique",
        "the validated matrix is at most the published cell limit",
        "a zero-total sample or group is reported as undefined, not as zero",
      ],
      unsupported_conditions: [
        "negative, fractional, missing, NaN or infinite counts",
        "floating-point counts through the HTTP boundary",
